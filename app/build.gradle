apply plugin: 'com.android.application'

android {
    namespace 'com.suburager.whatsmycodename'
    compileSdk 34

    defaultConfig {
        applicationId "com.suburager.whatsmycodename"
        minSdkVersion 3
        // 17, а не 3 - иначе современные прошивки (особенно MIUI)
        // включают "режим совместимости" и рисуют окно маленьким
        // островом в углу экрана вместо полного растягивания.
        // Ретро-вид от targetSdk не зависит - он определяется темой
        // (см. res/values*/styles.xml), а не этим числом.
        targetSdkVersion 17
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
